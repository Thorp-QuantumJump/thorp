name: thorp

services:
  postgres:
    image: postgres:16-alpine
    container_name: thorp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thorp}
      POSTGRES_USER: ${POSTGRES_USER:-thorp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thorp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thorp} -d ${POSTGRES_DB:-thorp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: thorp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: thorp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-thorp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-thorp}
    ports:
      - "5672:5672"     # AMQP — 로컬에서는 호스트에서 직접 붙는다
      - "15672:15672"   # 관리 UI (http://localhost:15672)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: thorp-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thorp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-thorp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-thorp}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-thorp}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-thorp}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ./worker
      dockerfile: ../infra/docker/worker.Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-thorp}:${RABBITMQ_PASSWORD:-thorp}@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-thorp}:${POSTGRES_PASSWORD:-thorp}@postgres:5432/${POSTGRES_DB:-thorp}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 3   # Worker 수를 조절해 분산 처리 실험

volumes:
  postgres-data:
  kafka-data:
  rabbitmq-data:
