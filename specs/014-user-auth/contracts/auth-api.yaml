openapi: 3.1.0
info:
  title: Thorp Account and Authentication API
  version: 0.1.0
  description: >-
    014-user-auth의 외부 /api 계약이다. 2026-09-16 기준 7개 operation은
    Backend 내부 경로와 FE proxy 경로에서 구현·검증됐다. 2026-09-29에 회원정보
    수정(닉네임 변경, PATCH /accounts/me)을 더했다. 2026-10-01에 카카오·구글·네이버 소셜
    로그인 operation 10개를 더했고 같은 날 구현·자동 계약 검증을 마쳤다(verification/social.md).
    실제 제공자 계정으로 지나는 흐름 확인은 남아 있다.
servers:
  - url: /api
paths:
  /accounts/email-verifications:
    post:
      operationId: requestEmailVerification
      summary: 이메일 인증번호 발송
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '204':
          description: 발송 요청 완료
        '400':
          $ref: '#/components/responses/EmailVerificationRequestRejected'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      summary: 이메일 인증번호 확인
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '204':
          description: 인증 완료. 이미 인증된 최신 요청도 성공으로 처리한다.
        '400':
          $ref: '#/components/responses/EmailVerificationConfirmRejected'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts:
    post:
      operationId: signup
      summary: 회원가입
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 계정 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupSuccessEnvelope'
        '400':
          $ref: '#/components/responses/SignupRejected'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/me:
    patch:
      operationId: changeNickname
      summary: 로그인한 사용자의 닉네임 변경
      description: >-
        회원정보 수정에서 바꿀 수 있는 것은 닉네임 하나다. 이메일은 가입 때 인증한 값이라
        바꾸지 않는다. 닉네임은 앞뒤 공백을 뗀 뒤 2~20자여야 하며 유일하지 않다.
        성공 응답은 현재 사용자 조회와 같은 AuthenticatedUser다.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeNicknameRequest'
      responses:
        '200':
          description: 닉네임 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserSuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/csrf:
    get:
      operationId: prepareCsrfToken
      summary: SPA 상태 변경 요청용 CSRF token 준비
      x-implementation-status: implemented
      responses:
        '204':
          description: XSRF-TOKEN cookie가 준비됨
          headers:
            Set-Cookie:
              description: XSRF-TOKEN cookie
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions:
    post:
      operationId: login
      summary: 이메일·비밀번호 로그인
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 완료 및 server session 생성
          headers:
            Set-Cookie:
              description: HttpOnly THORP_SESSION cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserSuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: 현재 로그인한 사용자 조회
      x-implementation-status: implemented
      responses:
        '200':
          description: 유효한 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserSuccessEnvelope'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions/current:
    delete:
      operationId: logout
      summary: 현재 server session 종료
      x-implementation-status: implemented
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: 세션 종료. 이미 비로그인인 경우에도 같은 결과를 반환한다.
          headers:
            Set-Cookie:
              description: 만료된 THORP_SESSION cookie
              schema:
                type: string
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social/providers:
    get:
      operationId: listSocialProviders
      summary: 자격 증명이 설정된 소셜 제공자 목록
      x-implementation-status: implemented
      responses:
        '200':
          description: 켜진 제공자. 없으면 빈 배열
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProvidersSuccessEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oauth2/authorization/{provider}:
    get:
      operationId: startSocialLogin
      summary: 소셜 로그인 시작(브라우저 전체 이동)
      description: >-
        Spring Security가 state를 만들어 세션에 보관하고 제공자 인가 화면으로 302 이동시킨다.
        새로 시작하면 남아 있던 가입 대기 상태를 지운다. 단 intent=link는 대기 중인 연결을
        이미 연결된 소셜 계정으로 확인하는 용도라 대기 상태를 유지한다. 이미 로그인한 사용자는
        /home으로 보낸다.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/SocialProviderPath'
        - name: reprompt
          in: query
          required: false
          description: true면 이메일 제공 동의를 다시 묻는다(카카오 scope=account_email, 네이버 auth_type=reprompt, 구글 prompt=consent)
          schema:
            type: boolean
        - name: intent
          in: query
          required: false
          schema:
            type: string
            enum: [link]
      responses:
        '302':
          description: 제공자 인가 화면으로 이동
        '404':
          $ref: '#/components/responses/SocialProviderNotEnabled'
  /auth/oauth2/callback/{provider}:
    get:
      operationId: socialLoginCallback
      summary: 제공자 redirect 대상
      description: >-
        JSON을 돌려주지 않는다. 판정 결과에 따라 FE 경로로 302 이동한다. 이동 주소에는 제공자 이름과
        판정 종류만 싣고 code·state는 남기지 않는다. 판정과 이동 대상은 plan.md Outcome classification 표를 따른다.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/SocialProviderPath'
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: access_denied면 사용자 취소로 처리한다
          schema:
            type: string
      responses:
        '302':
          description: >-
            /auth/social/complete, /signup/social, /auth/social/verify-email, /auth/social/link,
            /auth/social/email-required?provider=, /auth/social/already-linked?provider=,
            /login?social=cancelled|error 중 하나로 이동. 정지·탈퇴 계정은 상태를 드러내지 않고 error로 보낸다
  /auth/social/pending:
    get:
      operationId: getPendingSocialLogin
      summary: 현재 탭의 소셜 가입·연결 대기 상태 조회
      x-implementation-status: implemented
      responses:
        '200':
          description: 대기 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSocialSuccessEnvelope'
        '404':
          $ref: '#/components/responses/SocialPendingNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: cancelPendingSocialLogin
      summary: 대기 상태 취소. 없어도 204
      x-implementation-status: implemented
      security:
        - csrfToken: []
      responses:
        '204':
          description: 취소됨
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social/pending/email-verifications:
    post:
      operationId: requestSocialEmailVerification
      summary: 대기 상태가 정한 주소로 6자리 인증번호 발송
      description: >-
        stage=EMAIL_VERIFICATION이면 제공자 이메일로, stage=LINK이면 연결 대상 계정 이메일로 보낸다.
        재발송하면 이전 번호는 무효다. 본문이 없다.
      x-implementation-status: implemented
      security:
        - csrfToken: []
      responses:
        '204':
          description: 발송 요청 완료
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/SocialPendingNotFound'
        '429':
          $ref: '#/components/responses/SocialVerificationLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social/pending/email-verifications/confirm:
    post:
      operationId: confirmSocialEmailVerification
      summary: 제공자 이메일 인증번호 확인 후 재판정
      description: >-
        stage=EMAIL_VERIFICATION에서만 쓴다. 성공하면 판정을 다시 돌려 바뀐 대기 상태를 돌려준다.
        연결 대상 계정 이메일의 인증번호는 POST /auth/social/link(method=EMAIL_CODE)로 확인한다.
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialVerificationCodeRequest'
      responses:
        '200':
          description: 확인 완료. 다음 stage(SIGNUP 또는 LINK)의 대기 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSocialSuccessEnvelope'
        '400':
          $ref: '#/components/responses/EmailVerificationConfirmRejected'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/SocialPendingNotFound'
        '409':
          $ref: '#/components/responses/SocialConflict'
        '429':
          $ref: '#/components/responses/SocialVerificationLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social/signup:
    post:
      operationId: socialSignup
      summary: 소셜 신규 가입(추가 정보 제출) 후 로그인
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialSignupRequest'
      responses:
        '201':
          description: 계정 생성·소셜 연결·세션 생성(세션 ID 교체)
          headers:
            Set-Cookie:
              description: HttpOnly THORP_SESSION cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserSuccessEnvelope'
        '400':
          $ref: '#/components/responses/SocialSignupRejected'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/SocialPendingNotFound'
        '409':
          $ref: '#/components/responses/SocialConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social/link/decline:
    post:
      operationId: declineSocialLink
      summary: 기존 계정에 연결하지 않기
      description: >-
        stage=LINK에서만 쓴다. 휴대폰 번호가 겹쳐 온 연결(linkReason=PHONE)이면 대기 상태가 SIGNUP으로
        돌아가 다른 번호로 가입을 이어 간다. 이메일이 겹쳐 온 연결이면 대기 상태가 사라진다. 아무것도
        연결하거나 만들지 않는다(US7 시나리오 3·4). 결과는 getPendingSocialLogin으로 본다.
      x-implementation-status: implemented
      security:
        - csrfToken: []
      responses:
        '204':
          description: 처리됨
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/SocialPendingNotFound'
        '409':
          $ref: '#/components/responses/SocialConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social/link:
    post:
      operationId: confirmSocialLink
      summary: 기존 계정 소유 확인 후 소셜 계정 연결·로그인
      x-implementation-status: implemented
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLinkRequest'
      responses:
        '200':
          description: 연결·세션 생성(세션 ID 교체)
          headers:
            Set-Cookie:
              description: HttpOnly THORP_SESSION cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserSuccessEnvelope'
        '400':
          $ref: '#/components/responses/EmailVerificationConfirmRejected'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/SocialPendingNotFound'
        '409':
          $ref: '#/components/responses/SocialConflict'
        '429':
          $ref: '#/components/responses/SocialVerificationLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: THORP_SESSION
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    SocialProviderPath:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SocialProviderId'
  schemas:
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 앞뒤 공백 제거 후 소문자로 변환한 정규형
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, verificationCode]
      properties:
        email:
          type: string
          format: email
          description: 앞뒤 공백 제거 후 소문자로 변환한 정규형
        verificationCode:
          type: string
          pattern: '^\d{6}$'
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, nickname, phoneNumber]
      properties:
        email:
          type: string
          format: email
          description: 앞뒤 공백 제거 후 소문자로 변환한 정규형
        password:
          type: string
          minLength: 8
          maxLength: 25
          writeOnly: true
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        phoneNumber:
          type: string
          pattern: '^01[016789]\d{7,8}$'
          description: 하이픈·공백 없는 국내 휴대폰 번호
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: 앞뒤 공백 제거 후 소문자로 변환한 정규형
        password:
          type: string
          writeOnly: true
    ChangeNicknameRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: 앞뒤 공백을 뗀 뒤의 길이로 검증한다
    SignupResponse:
      type: object
      additionalProperties: false
      required: [userId, email, nickname, status]
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nickname:
          type: string
        status:
          type: string
          enum: [ACTIVE]
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [userId, email, nickname, status]
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nickname:
          type: string
        status:
          type: string
          enum: [ACTIVE]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - DUPLICATE_EMAIL
            - DUPLICATE_PHONE
            - EMAIL_VERIFICATION_REQUIRED
            - EMAIL_VERIFICATION_NOT_FOUND
            - EMAIL_VERIFICATION_INVALID
            - EMAIL_VERIFICATION_EXPIRED
            - INVALID_CREDENTIALS
            - AUTHENTICATION_REQUIRED
            - CSRF_TOKEN_INVALID
            - SOCIAL_PENDING_NOT_FOUND
            - SOCIAL_PENDING_STAGE_MISMATCH
            - SOCIAL_SIGNUP_REJECTED
            - SOCIAL_LINK_REQUIRED
            - SOCIAL_PROVIDER_ALREADY_LINKED
            - SOCIAL_ACCOUNT_ALREADY_LINKED
            - SOCIAL_PROVIDER_NOT_ENABLED
            - SOCIAL_VERIFICATION_LIMIT
            - SOCIAL_LINK_TEMPORARILY_LOCKED
            - EMAIL_VERIFICATION_RESEND_TOO_SOON
            - INTERNAL_ERROR
        message:
          type: string
    SocialProviderId:
      type: string
      enum: [kakao, google, naver]
    SocialProviders:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/SocialProviderId'
    PendingSocialView:
      type: object
      additionalProperties: false
      required: [provider, stage, email, linkMethods, expiresAt]
      properties:
        provider:
          $ref: '#/components/schemas/SocialProviderId'
        stage:
          type: string
          enum: [EMAIL_VERIFICATION, SIGNUP, LINK]
        email:
          type: string
          format: email
          description: 제공자 이메일의 정규형. 사용자 자신의 값이라 가리지 않는다
        suggestedNickname:
          type: [string, 'null']
          description: 제공자 닉네임이 2~20자일 때만
        linkReason:
          type: [string, 'null']
          enum: [EMAIL, PHONE, null]
        linkTargetMaskedEmail:
          type: [string, 'null']
          description: stage=LINK일 때 연결 대상 계정 이메일을 가린 값
        linkMethods:
          type: array
          description: stage=LINK일 때 대상 계정에 쓸 수 있는 소유 확인 방법. 그 밖의 stage는 빈 배열
          items:
            type: string
            enum: [PASSWORD, EMAIL_CODE, VERIFIED_EMAIL, SOCIAL_KAKAO, SOCIAL_GOOGLE, SOCIAL_NAVER]
        expiresAt:
          type: string
          format: date-time
    SocialVerificationCodeRequest:
      type: object
      additionalProperties: false
      required: [verificationCode]
      properties:
        verificationCode:
          type: string
          pattern: '^\d{6}$'
    SocialSignupRequest:
      type: object
      additionalProperties: false
      required: [nickname, phoneNumber]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        phoneNumber:
          type: string
          pattern: '^01[016789]\d{7,8}$'
    SocialLinkRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum: [PASSWORD, EMAIL_CODE, VERIFIED_EMAIL]
          description: 다른 소셜 계정으로의 확인은 startSocialLogin(intent=link)으로 한다
        password:
          type: string
          writeOnly: true
          description: method=PASSWORD일 때 필수
        verificationCode:
          type: string
          pattern: '^\d{6}$'
          description: method=EMAIL_CODE일 때 필수
    SocialProvidersSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/SocialProviders'
        error:
          type: 'null'
    PendingSocialSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/PendingSocialView'
        error:
          type: 'null'
    SignupSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/SignupResponse'
        error:
          type: 'null'
    AuthenticatedUserSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success:
          const: true
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        error:
          type: 'null'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success:
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
  responses:
    EmailVerificationRequestRejected:
      description: 입력 형식 오류 또는 이미 가입된 이메일
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidInput:
              value:
                success: false
                data: null
                error:
                  code: INVALID_INPUT
                  message: 이메일 형식을 확인해 주세요.
            duplicateEmail:
              value:
                success: false
                data: null
                error:
                  code: DUPLICATE_EMAIL
                  message: 이미 가입된 이메일입니다.
    EmailVerificationConfirmRejected:
      description: 입력 형식, 인증 요청, 인증번호 또는 만료 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              value:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_NOT_FOUND
                  message: 인증 요청을 찾을 수 없습니다. 인증번호를 다시 요청해 주세요.
            invalidCode:
              value:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_INVALID
                  message: 인증번호를 다시 확인해 주세요.
            expired:
              value:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_EXPIRED
                  message: 인증번호가 만료되었습니다. 인증번호를 다시 요청해 주세요.
    SignupRejected:
      description: 입력 형식, 중복 계정 또는 이메일 인증 조건 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            duplicateEmail:
              value:
                success: false
                data: null
                error:
                  code: DUPLICATE_EMAIL
                  message: 이미 가입된 이메일입니다.
            duplicatePhone:
              value:
                success: false
                data: null
                error:
                  code: DUPLICATE_PHONE
                  message: 이미 가입된 전화번호입니다.
            verificationRequired:
              value:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_REQUIRED
                  message: 이메일 인증을 완료해 주세요.
    InvalidInput:
      description: 입력 형식, 중복 계정, 인증번호 상태 또는 이메일 인증 조건 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: INVALID_INPUT
              message: 입력값이 올바르지 않습니다.
    InvalidCredentials:
      description: 이메일·비밀번호 또는 계정 상태로 인증할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: INVALID_CREDENTIALS
              message: 이메일 또는 비밀번호를 확인해 주세요.
    AuthenticationRequired:
      description: 유효한 로그인 상태 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: AUTHENTICATION_REQUIRED
              message: 로그인이 필요합니다.
    InvalidCsrf:
      description: CSRF token 누락 또는 불일치
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: CSRF_TOKEN_INVALID
              message: 요청 확인 정보가 만료되었습니다. 다시 시도해 주세요.
    InternalError:
      description: 예상하지 못한 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: INTERNAL_ERROR
              message: 서버 내부 오류가 발생했습니다.
    SocialPendingNotFound:
      description: 가입·연결 대기 상태가 없거나 만료됐거나 이미 사용됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: SOCIAL_PENDING_NOT_FOUND
              message: 소셜 로그인 시간이 지났습니다. 처음부터 다시 시도해 주세요.
    SocialConflict:
      description: 기존 계정과 겹쳤거나 대기 상태의 단계가 요청과 맞지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            linkRequired:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_LINK_REQUIRED
                  message: 이 번호로 가입된 계정이 있습니다. 계정 연결을 확인해 주세요.
            providerAlreadyLinked:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_PROVIDER_ALREADY_LINKED
                  message: 이 계정은 이미 다른 카카오 계정과 연결되어 있습니다.
            stageMismatch:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_PENDING_STAGE_MISMATCH
                  message: 지금 단계에서는 할 수 없는 요청입니다. 화면을 새로고침해 주세요.
            accountAlreadyLinked:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_ACCOUNT_ALREADY_LINKED
                  message: 이 소셜 계정은 다른 Thorp 계정에 연결되어 있습니다.
    SocialProviderNotEnabled:
      description: 지원하지 않거나 자격 증명이 설정되지 않은 제공자
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: SOCIAL_PROVIDER_NOT_ENABLED
              message: 지금은 이 방법으로 로그인할 수 없습니다.
    SocialSignupRejected:
      description: 입력 형식 오류, 또는 휴대폰 번호가 쓸 수 없는 기존 계정과 겹침
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidInput:
              value:
                success: false
                data: null
                error:
                  code: INVALID_INPUT
                  message: 입력값이 올바르지 않습니다.
            rejected:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_SIGNUP_REJECTED
                  message: 지금은 이 정보로 가입할 수 없습니다. 다른 방법으로 로그인해 주세요.
    SocialVerificationLimited:
      description: >-
        인증번호 다시 받기 간격 안이거나(대기 상태 유지), 확인 시도·발송 상한을 넘었다(대기 상태를 버림, 처음부터 다시).
        번호 하나는 5번까지만 대조하고 대조 전에 센다. 같은 기존 계정을 향한 대조는 대기 상태가 바뀌어도 한 시간에 10번,
        그 계정 이메일로의 발송은 5통까지다(SOCIAL_LINK_TEMPORARILY_LOCKED, 대기 상태 유지, 그 계정의 로그인은 막지 않음).
        수치는 별도 보안 작업 전까지의 임시값이다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            resendTooSoon:
              value:
                success: false
                data: null
                error:
                  code: EMAIL_VERIFICATION_RESEND_TOO_SOON
                  message: 인증번호를 방금 보냈습니다. 잠시 후 다시 받아 주세요.
            targetLocked:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_LINK_TEMPORARILY_LOCKED
                  message: 이 계정에 대한 확인 시도가 많아 잠시 막았습니다. 1시간 뒤 다시 시도하거나 다른 방법으로 로그인해 주세요.
            limit:
              value:
                success: false
                data: null
                error:
                  code: SOCIAL_VERIFICATION_LIMIT
                  message: 확인 시도 횟수를 넘었습니다. 소셜 로그인을 처음부터 다시 시도해 주세요.
