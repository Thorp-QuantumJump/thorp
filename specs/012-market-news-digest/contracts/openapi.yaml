openapi: 3.1.0
info:
  title: Thorp Market News Digest API
  version: 1.0.0
  description: >-
    시장 흐름 화면이 소비할 뉴스 묶음 계약이다. 외부 경로의 /api는 프록시가 제거하므로
    Spring controller 매핑은 /market-news/digests이다. 기사 본문은 어떤 schema에도 포함하지 않는다.
servers:
  - url: /api
paths:
  /market-news/digests:
    get:
      summary: 현재 또는 지정 기간의 뉴스 묶음 조회
      parameters:
        - name: sectorId
          in: query
          required: false
          description: >-
            GET /market-news/sectors가 주는 섹터 식별자다. 투자 대상 섹터는 spec 001이 소유하는
            값이고, NEWS_로 시작하는 값은 012가 소유하는 뉴스 전용 섹터다(Session 2026-09-25).
            형식을 따로 검증하지 않고 두 목록에 있는지만 본다. 형식 규칙을 여기 적어 두면
            001이 규칙을 바꾼 날 001은 발급할 수 있는데 뉴스는 거부하는 값이 생긴다.
            여러 번(sectorId=A&sectorId=B) 또는 쉼표로 이어(sectorId=A,B) 줄 수 있다. 여럿이면 그중
            하나 이상과 연결된 묶음을 주요도 순으로 한 번씩만 주고, 응답의 sectorId는 null이다
            (2026-10-02, spec FR-001 ③ 분류별 뉴스). 한 번에 최대 12개이고, 과거 구간은 하나까지만 받는다.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 12
            items:
              type: string
        - name: limit
          in: query
          required: false
          description: >-
            받을 묶음 수(1 이상). 서버 상한(thorp.news.max-digests, 기본 20)보다 크면 상한까지만 준다.
            생략하면 예전과 같은 3개다. 모자라면 있는 만큼만 주고 채우지 않는다(spec FR-001). 정렬 규칙
            news-importance-v1은 그대로다(2026-10-02).
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          description: 과거 조회 시작 시각. to와 함께 전달해야 한다.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 과거 조회 종료 시각. from과 함께 전달해야 하며 최대 구간은 93일이다.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: READY, EMPTY, STALE, PREPARING을 포함한 정상 조회
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsDigestEnvelope'
              examples:
                currentReady:
                  externalValue: ./examples/current-ready.json
                currentStale:
                  externalValue: ./examples/current-stale.json
                publicPreparing:
                  externalValue: ./examples/public-preparing.json
                historicalEmpty:
                  externalValue: ./examples/historical-empty.json
        '400':
          description: >-
            from/to 한쪽 누락, 역전된 기간, 93일 초과, 001 대응표와 뉴스 전용 섹터 어디에도 없는 sectorId
            (여럿 가운데 하나라도), 섹터 13개 이상, 과거 구간에 섹터 둘 이상, 1보다 작은 limit.
            대응표가 아직 발행되지 않은 동안의 섹터 지정 조회는 오류가 아니라 200 EMPTY다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: 내부 오류. 외부 원천 장애와 빈 뉴스는 이 응답을 사용하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /market-news/sectors:
    get:
      summary: 뉴스를 좁혀 볼 수 있는 섹터 목록
      description: >-
        투자 대상 섹터(spec 001에 열린 것)와 뉴스 전용 섹터를 화면 순서로 준다. 001 대응표가
        아직 발행되지 않았으면 뉴스 전용 섹터만 온다. 화면은 이 목록으로 칩을 그리고 섹터
        이름을 상수로 두지 않는다.
      responses:
        '200':
          description: 섹터 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSectorListEnvelope'
  /market-news/articles/export:
    get:
      summary: 허가 범위 내 기사 메타데이터 JSON 내보내기
      parameters:
        - name: sectorId
          in: query
          required: false
          description: >-
            GET /market-news/sectors가 주는 섹터 식별자다. 투자 대상 섹터는 spec 001이 소유하는
            값이고, NEWS_로 시작하는 값은 012가 소유하는 뉴스 전용 섹터다(Session 2026-09-25).
            형식을 따로 검증하지 않고 두 목록에 있는지만 본다. 형식 규칙을 여기 적어 두면
            001이 규칙을 바꾼 날 001은 발급할 수 있는데 뉴스는 거부하는 값이 생긴다.
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: >-
            매체의 최신 회신에서 허용된 기사 메타데이터만 반환한다. 노출 모드와 무관하게
            허가 필터를 적용하므로 내부 검증 환경에서도 회신 전 매체의 항목은 나오지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsArticleExportEnvelope'
              examples:
                allowed:
                  externalValue: ./examples/export-allowed.json
        '400':
          description: >-
            잘못된 기간, 001 대응표와 뉴스 전용 섹터 어디에도 없는 sectorId, 잘못된 cursor 또는 limit.
            대응표가 아직 발행되지 않은 동안의 섹터 지정 요청은 오류가 아니라 200 빈 items다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    NewsSectorListEnvelope:
      type: object
      required: [httpStatus, isSuccess, message, code, result]
      properties:
        httpStatus: { type: string, const: OK }
        isSuccess: { type: boolean, const: true }
        message: { type: string }
        code: { type: integer, const: 200 }
        result:
          type: object
          required: [sectors]
          properties:
            sectors:
              type: array
              items:
                $ref: '#/components/schemas/NewsSector'
    NewsSector:
      type: object
      required: [sectorId, name, investable]
      properties:
        sectorId: { type: string }
        name: { type: string, description: 화면 이름. 투자 대상 섹터는 001의 이름이다. }
        investable:
          type: boolean
          description: 참이면 spec 001 대응표의 투자 대상 섹터, 거짓이면 뉴스 전용 섹터다.
    NewsDigestEnvelope:
      type: object
      required: [httpStatus, isSuccess, message, code, result]
      properties:
        httpStatus: { type: string, const: OK }
        isSuccess: { type: boolean, const: true }
        message: { type: string }
        code: { type: integer, const: 200 }
        result:
          $ref: '#/components/schemas/NewsDigestResult'
    NewsDigestResult:
      type: object
      description: >-
        값이 없는 필드는 키를 생략하지 않고 명시적 null로 보낸다. 화면이 "키가 없다"와
        "값이 없다"를 구별하려 들면 상태 판정이 두 곳으로 갈라진다.
      required:
        - context
        - state
        - sectorId
        - from
        - to
        - lastUpdatedAt
        - stale
        - statusMessage
        - digests
      properties:
        context:
          type: string
          enum: [CURRENT, HISTORICAL]
        state:
          type: string
          enum: [READY, EMPTY, STALE, PREPARING]
        sectorId:
          type: [string, 'null']
        from:
          type: [string, 'null']
          format: date-time
        to:
          type: [string, 'null']
          format: date-time
        lastUpdatedAt:
          type: [string, 'null']
          format: date-time
        stale:
          type: boolean
        statusMessage:
          type: [string, 'null']
        digests:
          type: array
          description: >-
            주요도 순서다. 개수는 요청의 limit(생략하면 3)과 서버 상한(thorp.news.max-digests, 기본 20) 중
            작은 값까지이고 모자라면 채우지 않는다(2026-10-02, 예전 상한 3).
          maxItems: 20
          items:
            $ref: '#/components/schemas/NewsDigest'
    NewsDigest:
      type: object
      required:
        - digestId
        - representativeTitle
        - factualSummary
        - firstPublishedAt
        - publicationTimeStatus
        - publisherCount
        - sectors
        - topics
        - importanceRuleVersion
        - articles
      properties:
        digestId:
          type: string
          pattern: '^[a-z2-7]{32}$'
          description: >-
            대표 articleId와 묶음 규칙 버전에서 결정론적으로 유도한 안정 식별자다.
            내부 저장 순번을 노출하지 않으며 같은 대상은 다시 수집해도 같은 값이다.
        representativeTitle: { type: string }
        factualSummary: { type: string }
        firstPublishedAt:
          type: [string, 'null']
          format: date-time
        publicationTimeStatus:
          type: string
          enum: [VERIFIED, UNKNOWN]
        publisherCount:
          type: integer
          minimum: 1
        sectors:
          type: array
          items: { type: string }
        topics:
          type: array
          items: { type: string }
        importanceRuleVersion: { type: string }
        articles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NewsArticle'
    NewsArticle:
      type: object
      required: [articleId, title, publisher, publishedAt, publicationTimeStatus, originalUrl]
      properties:
        articleId:
          type: string
          pattern: '^[a-z2-7]{32}$'
          description: >-
            canonical URL에서 결정론적으로 유도한 안정 식별자다.
            내부 저장 순번을 노출하지 않으며 같은 기사는 다시 수집해도 같은 값이다.
        title: { type: string }
        publisher: { type: string }
        publishedAt:
          type: [string, 'null']
          format: date-time
        publicationTimeStatus:
          type: string
          enum: [VERIFIED, UNKNOWN]
        originalUrl:
          type: string
          format: uri
    NewsArticleExportEnvelope:
      type: object
      required: [httpStatus, isSuccess, message, code, result]
      properties:
        httpStatus: { type: string, const: OK }
        isSuccess: { type: boolean, const: true }
        message: { type: string }
        code: { type: integer, const: 200 }
        result:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/NewsArticleExportItem'
            nextCursor:
              type: [string, 'null']
    NewsArticleExportItem:
      type: object
      required: [articleId, publicationTimeStatus]
      description: >-
        articleId와 publicationTimeStatus 외의 필드는 매체의 최신 회신에서 허용된 경우에만 포함한다.
        기사 본문 필드는 정의하지 않는다.
      properties:
        articleId:
          type: string
          pattern: '^[a-z2-7]{32}$'
          description: >-
            canonical URL에서 결정론적으로 유도한 안정 식별자다.
            내부 저장 순번을 노출하지 않으며 같은 기사는 다시 수집해도 같은 값이다.
        title: { type: string }
        publisher: { type: string }
        publishedAt:
          type: [string, 'null']
          format: date-time
        publicationTimeStatus:
          type: string
          enum: [VERIFIED, UNKNOWN]
        originalUrl:
          type: string
          format: uri
    ErrorEnvelope:
      type: object
      required: [httpStatus, isSuccess, message, code, result]
      properties:
        httpStatus: { type: string }
        isSuccess: { type: boolean, const: false }
        message: { type: string }
        code: { type: integer }
        result: { type: 'null' }
