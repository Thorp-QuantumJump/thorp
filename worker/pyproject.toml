[project]
name = "thorp-worker"
version = "0.1.1"
description = "Backtest worker: Kafka에서 Job을 받아 백테스트를 실행하고 결과를 저장한다"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "SQLAlchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "nautilus_trader==1.219.0",
    "yfinance==0.2.65",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
