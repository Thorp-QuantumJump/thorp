# 배우기 게시 전 검사 규칙(spec 013 research R7, data-model §6).
#
# 출발안이다. 기획서가 확정한 목록이 아니며 팀이 검토해 바꿀 수 있다.
# 목록을 바꾸면 파일 이름과 version을 함께 올리고 옛 파일은 지우지 않는다(판이 버전을 기록한다).
#
# 이 검사는 패턴 검사다. 목록에 없는 우회 표현이나 문맥상 권고로 읽히는 문장은 잡지 못한다.
# SC-002의 필요조건이며 충분조건이 아니다 — 문장 검토 책임은 게시하는 운영자에게 남는다.
version: learning-publish-checks-v1

# 제목·질문·모든 블록·용어 이름과 문장에서, 공백을 하나로 줄인 문자열로 부분 일치를 찾는다.
# 무리마다 message가 게시 거절 항목의 문장이 된다. 화면은 이 문장을 그대로 보인다.
# 제목 '과거가 미래를 보장하지 않는 이유'가 걸리지 않도록 '보장' 단독은 넣지 않는다.
forbiddenExpressions:
  recommendation:
    message: 추천으로 읽히는 표현이 있습니다.
    expressions: [추천 비중, 추천합니다, 권합니다, 매수하세요, 매도하세요, 투자하세요, 사세요, 파세요]
  probability:
    message: 확률로 읽히는 표현이 있습니다.
    expressions: [확률, 가능성이 높, 가능성이 큽, 성공률]
  superiority:
    message: 어느 전략이 낫다고 읽히는 표현이 있습니다.
    expressions: [최고의 전략, 가장 좋은 전략, 이기는 전략, 우승 전략, 승자, 더 우월]
  currentValidity:
    message: 지금도 통한다고 읽히는 표현이 있습니다.
    expressions: [지금도 유효, 여전히 유효, 앞으로도 통, 지금 사도]
  profitGuarantee:
    message: 수익을 보장한다고 읽히는 표현이 있습니다.
    expressions: [수익 보장, 손실 없, 보장합니다]

# hypothetical 블록 밖의 텍스트(제목·질문·heading·paragraph·용어 이름과 문장)에서 찾는 숫자 패턴(Java 정규식).
# 걸린 문자열이 matched로 나간다.
resultNumberPatterns:
  # 숫자 + % 또는 %p. 예: 12.5%, -30%, 3%p
  - '[-+]?\d+(?:[.,]\d+)*\s?%p?'
  # 숫자 + 원·만 원·억 원·억. 예: 120만 원, 1,000원
  - '[-+]?\d+(?:[.,]\d+)*\s?(?:만\s?원|억\s?원|억|원)'
  # 숫자 + 배. 예: 2배
  - '[-+]?\d+(?:[.,]\d+)*\s?배'

# 걸린 문자열이 이 값과 정확히 같으면 걸리지 않는다. 비중 합계를 설명하는 100%다.
allowedExceptions: ['100%']
