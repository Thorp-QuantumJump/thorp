# 배우기 게시 전 검사 규칙 v2(spec 013 research R19·R20, data-model §8-2·§8-3). V2 글의 글마다 게시와 단계 공개가 쓴다.
#
# 출발안이다. 기획서가 확정한 목록이 아니며 팀이 검토해 바꿀 수 있다.
# 값을 바꾸면 파일 이름과 version을 함께 올리고 옛 파일은 지우지 않는다(판이 버전을 기록한다).
# v1 파일(publish-checks-v1.yml)은 V1 이전 판 고치기가 계속 쓰므로 고치지 않는다.
#
# 금지 표현과 결과성 숫자는 패턴 검사다. 목록에 없는 우회 표현이나 문맥상 권고로 읽히는 문장은 잡지 못한다.
# SC-002의 필요조건이며 충분조건이 아니다 — 문장 검토 책임은 원고 MR 검토와 게시하는 운영자에게 남는다.
version: learning-publish-checks-v2

# v1과 같은 다섯 무리. 호환 문자를 표준 문자로 바꾸고(NFKC) 공백을 하나로 줄인 문자열에서 부분 일치로 찾는다.
# 대상: 제목, 질문, 모든 V2 블록의 글자(오해의 틀린 생각 칸 제외), 표의 머리 칸과 제목, 도식의 제목·계열 이름·설명,
# 용어의 이름·다른 이름·세 문장, 확인 문제의 질문·정답 보기·풀이.
# 틀린 보기와 오해의 틀린 생각 칸, 출처 표시의 이름(외부 자료 제목)은 검사하지 않는다(FR-017).
# 제목 '과거가 미래를 보장하지 않는 이유'가 걸리지 않도록 '보장' 단독은 넣지 않는다.
forbiddenExpressions:
  recommendation:
    message: 추천으로 읽히는 표현이 있습니다.
    expressions: [추천 비중, 추천합니다, 권합니다, 매수하세요, 매도하세요, 투자하세요, 사세요, 파세요]
  probability:
    message: 확률로 읽히는 표현이 있습니다.
    expressions: [확률, 가능성이 높, 가능성이 큽, 성공률]
  superiority:
    message: 어느 전략이 낫다고 읽히는 표현이 있습니다.
    expressions: [최고의 전략, 가장 좋은 전략, 이기는 전략, 우승 전략, 승자, 더 우월]
  currentValidity:
    message: 지금도 통한다고 읽히는 표현이 있습니다.
    expressions: [지금도 유효, 여전히 유효, 앞으로도 통, 지금 사도]
  profitGuarantee:
    message: 수익을 보장한다고 읽히는 표현이 있습니다.
    expressions: [수익 보장, 손실 없, 보장합니다]

# v1과 같은 세 패턴(Java 정규식). 대상: 제목, 질문, 소제목, 핵심 요약, 문단, 목록, 용어의 이름·다른 이름·세 문장.
# 가상의 계산 예·도식·오해·비교 표·확인 문제·제도 안내는 숫자 검사를 하지 않는다(FR-005, FR-026).
resultNumberPatterns:
  # 숫자 + % 또는 %p. 예: 12.5%, -30%, 3%p
  - '[-+]?\d+(?:[.,]\d+)*\s?%p?'
  # 숫자 + 원·만 원·억 원·억. 예: 120만 원, 1,000원. '제1원칙'의 1원은 걸지 않는다.
  - '[-+]?\d+(?:[.,]\d+)*\s?(?:만\s?원|억\s?원|억|원(?!칙))'
  # 숫자 + 배. 예: 2배. 숫자와 '배' 사이 공백을 허용하지 않고 배분·배정·배치·배열·배당은 걸지 않는다('50:50 배분').
  - '[-+]?\d+(?:[.,]\d+)*배(?![분정치열당])'

# 걸린 문자열이 이 값과 정확히 같으면 걸리지 않는다. 비중 합계를 설명하는 100%다.
allowedExceptions: ['100%']

# 문단과 목록에서 이 표지로 시작해 다음 ')'로 닫히는 괄호 안에서 시작하는 숫자는 걸지 않는다. 예: '(예: 왕복 약 0.19%)'.
exampleMarker: '(예:'

# 예시(002로 넘기는 섹터·비중)를 요구하는가. v2는 글마다 고른다(FR-003).
# constitution 6.2.0 초안이 반려되면 true인 v3 파일을 더한다(R19). 이 파일은 고치지 않는다.
exampleRequired: false

# 예상 읽기 시간과 최소 머문 시간(R20).
# 보이는 분 = 반올림(본문 글자 수 ÷ charsPerMinute), 최소 1분. 게시 조건은 minutesRange 안이다.
# 최소 머문 시간 = max(minDwellFloorSeconds, 올림(반올림 전 예상 읽기 초 ÷ minDwellDivisor)).
reading:
  charsPerMinute: 500
  minutesRange: [4, 7]
  minDwellDivisor: 3
  minDwellFloorSeconds: 30

# 확인 문제 수와 문제마다 보기 수(FR-022). 정답 보기는 정확히 하나다.
quiz:
  questionsRange: [2, 3]
  choicesRange: [2, 5]
