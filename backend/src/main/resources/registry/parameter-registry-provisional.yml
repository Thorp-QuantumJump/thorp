# 전략·파라미터 등록표의 임시 대역(stand-in). spec 003이 완성되면 이 파일과 로더를 003 구현체로 교체한다.
#
# 이 파일이 전략 데이터의 유일한 위치다(spec 007 FR-025, research R1 개정). 007의 운영 코드에는
# 전략 ID·전략명·파라미터값·허용 범위가 나타나지 않는다. 로더(ProvisionalFileParameterRegistry)는
# 아래 구조만 읽고 전략별 해석을 하지 않는다.
#
# !! 이 값은 팀 확정값이 아니다(PD-02 미확정) !!
#   version 이 PROVISIONAL- 로 시작하는 것으로 그 사실을 API 응답과 화면에 계속 표시한다.
#   확정되면 version 을 003 등록표의 버전으로 바꾼다. 값이 바뀌면 행을 고치지 말고 새 버전을 만든다 —
#   끝난 탐색을 나중 값으로 재해석하면 재현이 깨진다.
#
# 축의 순서와 searchValues 의 순서가 grid_coordinates 인덱스의 뜻이다(FR-029).
# 같은 version 안에서 순서를 바꾸지 않는다. 순서를 바꾸려면 version 을 올린다.
#
# validationRules 문법(로더가 읽는 전부다. 규칙의 뜻은 등록표가 정하고 007은 코드만 옮긴다):
#   code      위반 사유 코드. 후보에 그대로 저장되고 화면에 표시된다
#   detail    사용자에게 보여줄 한 문장
#   left/right 피연산자. 아래 셋 중 하나를 쓴다
#       axis: <축 이름>        그 조합의 축 값
#       context: <맥락 키>     현재 UNIVERSE_SIZE(후보 섹터 집합의 크기) 하나다
#       value: <상수>
#     axis 피연산자에는 multiplyByContext: <맥락 키> 를 덧붙여 곱할 수 있다
#   operator  GREATER_THAN | GREATER_OR_EQUAL | LESS_THAN | LESS_OR_EQUAL | EQUAL | NOT_EQUAL
#   조건이 참이면 그 조합은 위반이다(제외된다).

version: PROVISIONAL-20260911

# 손실 제약의 기준으로 쓸 전략(FR-013d). 007 코드에 기준 전략 ID를 두지 않기 위해 여기서 지정한다.
# 비우면 하락 폭 필터를 적용하지 않고 그 사실을 결과에 표시한다.
baselineStrategyId: EQUAL_WEIGHT

strategies:
  - id: EQUAL_WEIGHT
    name: 동일 비중
    description: 투자 가능한 섹터에 같은 금액을 배분한다.
    # 파라미터가 없는 전략이다. 축이 없으면 조합 1건이다(FR-027).
    axes: []

  - id: FIXED_WEIGHT
    name: 고정 비중
    description: 사용자가 지정한 비중을 유지한다.
    # 목표 비중은 사용자가 직접 정하는 값이라 자동 탐색 축으로 두지 않는다.
    axes: []

  - id: INVERSE_VOLATILITY
    name: 역변동성
    description: 변동성이 낮은 섹터에 더 많이 배분한다.
    axes:
      - name: lookbackDays
        label: 변동성 관측 기간
        unit: 거래일
        searchValues: [21, 63, 126, 252]
        defaultValue: 63
        allowedRange:
          min: 10
          max: 504
          step: 1

  - id: SECTOR_MOMENTUM
    name: 섹터 모멘텀
    description: 최근 상승 폭이 큰 섹터를 골라 배분한다.
    axes:
      - name: lookbackDays
        label: 관측 기간
        unit: 거래일
        searchValues: [20, 60, 120]
        defaultValue: 60
        allowedRange:
          min: 10
          max: 252
          step: 1
      - name: topN
        label: 선정 섹터 수
        searchValues: [2, 3, 4]
        defaultValue: 3
        allowedRange:
          min: 1
          max: 20
          step: 1
    validationRules:
      # 후보 섹터보다 많이 고를 수는 없다. 계산 없이 판정되므로 조합 생성 단계에서 제외한다(FR-006).
      - code: TOP_N_EXCEEDS_UNIVERSE
        detail: 선정 섹터 수가 후보 섹터 집합의 크기보다 큽니다.
        left:
          axis: topN
        operator: GREATER_THAN
        right:
          context: UNIVERSE_SIZE

  - id: MINIMUM_VARIANCE
    name: 최소분산
    description: 전체 변동이 가장 작아지는 비중을 찾는다.
    axes:
      - name: lookbackDays
        label: 공분산 관측 기간
        unit: 거래일
        searchValues: [60, 120, 250]
        defaultValue: 120
        allowedRange:
          min: 20
          max: 504
          step: 1
      - name: maxWeight
        label: 섹터당 최대 비중
        unit: 퍼센트
        searchValues: [30, 40, 50]
        defaultValue: 40
        allowedRange:
          min: 10
          max: 100
          step: 5
    validationRules:
      # 섹터당 상한(%) × 후보 섹터 수가 100에 못 미치면 전액을 배분할 수 없다.
      - code: MAX_WEIGHT_TOO_LOW_FOR_UNIVERSE
        detail: 섹터당 최대 비중이 낮아 후보 섹터만으로 전액을 배분할 수 없습니다.
        left:
          axis: maxWeight
          multiplyByContext: UNIVERSE_SIZE
        operator: LESS_THAN
        right:
          value: 100
