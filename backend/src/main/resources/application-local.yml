spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/thorp}
    username: ${SPRING_DATASOURCE_USERNAME:thorp}
    password: ${SPRING_DATASOURCE_PASSWORD:thorp}

  # 개발 편의를 위해 Hibernate가 스키마를 갱신한다.
  jpa:
    hibernate:
      ddl-auto: update

  # Hibernate와 Flyway가 동시에 스키마를 바꾸지 않도록 로컬에서는 Flyway를 끈다.
  # 마이그레이션을 직접 확인하려면 SPRING_FLYWAY_ENABLED=true + ddl-auto=validate로 임시 전환한다.
  flyway:
    enabled: false

  # 로컬은 Flyway가 꺼져 있으므로 Spring Session의 공식 PostgreSQL 스크립트로 세션 테이블을 준비한다.
  session:
    jdbc:
      initialize-schema: always

  # 백테스트 Job·이벤트 브로커. 토폴로지(exchange/queue/DLQ)는 BacktestRabbitConfig가 선언한다.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:thorp}
    password: ${SPRING_RABBITMQ_PASSWORD:thorp}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  servlet:
    session:
      cookie:
        secure: false

# 자동 탐색(spec 007) 로컬 개발값. 네 값 모두 **개발 편의값이며 팀 확정값이 아니다.**
# API 응답의 limits.provisional에 네 항목이 모두 실려 화면에 임시값 표시가 붙는다(FR-005a).
# 확정값은 PD-06(후보 수 상한 실측)과 PD-05 잔여(나머지 셋) 결정을 기다린다.
thorp:
  ops:
    # 개발용 운영자 토큰. quickstart S10 이 X-Ops-Token 에 이 값을 보낸다. 운영 값은 .env.prod 의 THORP_OPS_TOKEN.
    token: dev-ops-token
  param-search:
    # 로컬은 필수 세 값이 채워져 있어 켠다. 개발 중 자동 탐색을 쓰는 곳이 여기다.
    enabled: true
    # 로컬에서도 등록된 설정 조합을 최대 100개까지 한 묶음으로 실행한다.
    # 상한 초과 거부 경로는 ParamSearchRejectionIT 가 max-candidates=2 로 낮춘 프로파일에서 검증한다.
    max-candidates: 100
    # 현재 서버의 자동 탐색 벌크 워커 1개와 맞춘다. prefetch 1이라 후보 1개가 실제 실행된다.
    dispatch-window: 1
    # 공통 설정과 같이 실행시간 상한을 두지 않는다. 비운 채로 두면 묶음이 후보를 다 돌고 끝난다.
    time-limit-seconds:
    consecutive-failure-limit: 3
  result:
    # 결과 공개 열람(spec 005) 로컬 개발값. 만료 화면(410)을 손으로 확인하기 쉽게 유효 시간을 짧게 둔다.
    public-token-ttl: PT1H
    expiry-sweep-interval: PT1M
    expiry-sweep-batch-size: 100
    tombstone-retention: PT2H
    trades-page-size: 100
    progress-stream-timeout: PT4M
