spring:
  application:
    name: thorp-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: update   # TODO: 스키마 안정화 후 validate + 마이그레이션 도구(Flyway)로 전환
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Job 전달에는 사용하지 않는다. 브로커는 RabbitMQ(spring.rabbitmq). Kafka는 설치만 해둔 상태이며
  # 전환·병행은 실측 후 결정한다 (루트 CLAUDE.md). 브로커 없이도 지연 연결이라 기동에 영향 없음.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:  # 미사용 (위 주석 참조). 큐 이름은 BacktestRabbitConfig 상수.
    backtest-job-topic: ${BACKTEST_JOB_TOPIC:backtest.jobs}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
