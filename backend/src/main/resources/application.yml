spring:
  application:
    name: thorp-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/thorp}
    username: ${SPRING_DATASOURCE_USERNAME:quantum}
    password: ${SPRING_DATASOURCE_PASSWORD:quantum}

  jpa:
    hibernate:
      ddl-auto: update   # TODO: 스키마 안정화 후 validate + 마이그레이션 도구(Flyway)로 전환
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    backtest-job-topic: ${BACKTEST_JOB_TOPIC:backtest.jobs}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
