spring:
  application:
    name: thorp-backend

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/thorp}
    username: ${SPRING_DATASOURCE_USERNAME:thorp}
    password: ${SPRING_DATASOURCE_PASSWORD:thorp}
  profiles:
    default: local

  # 인증 상태는 서버가 관리하고 PostgreSQL에 저장한다. 테이블 초기화 방식은 프로필별로 정한다.
  session:
    # 마지막 요청에서 이만큼 지나면 세션이 만료된다. 로그인 유지 선택지는 제공하지 않으므로 이 값이 유일한 기준이고,
    # FE는 남은 시간을 추정하지 않는다(plan Constraints). 만료된 세션의 요청은 401 AUTHENTICATION_REQUIRED다.
    timeout: ${SPRING_SESSION_TIMEOUT:30m}

  # 스키마 관리 정책은 프로필별로 갈린다.
  #  - local: Hibernate ddl-auto=update (Flyway 비활성)
  #  - prod : Flyway가 마이그레이션, Hibernate는 ddl-auto=validate로 검증만
  # 공통에는 ddl-auto를 두지 않는다. 여기에 값이 있으면 운영에서도 Hibernate가 스키마를 건드린다.
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 백테스트 결과의 거래 행은 한 번에 수백 건씩 INSERT된다. 배칭이 없으면 건마다 왕복한다.
        # SEQUENCE PK 엔티티(backtest_trade·backtest_job)에만 효과가 있고, IDENTITY PK(회원 테이블)는 원래 배칭되지 않는다.
        jdbc:
          batch_size: 50
        order_inserts: true

  # 백테스트 Job·이벤트 브로커. 토폴로지(exchange/queue/DLQ)는 BacktestRabbitConfig가 선언한다.
  # confirm·returns 설정은 발행 신뢰성(outbox) 작업에서 추가.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:thorp}
    password: ${SPRING_RABBITMQ_PASSWORD:thorp}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}
    # 발행은 Job 생성 트랜잭션 안에서 일어난다. 브로커가 응답하지 않을 때 클라이언트 기본값(60초)만큼 기다리면
    # 그동안 DB 커넥션을 잡고 있게 되므로 짧게 끊는다. 발행이 트랜잭션 밖(outbox relay)으로 나가면 재검토한다.
    connection-timeout: 5s
    # 결과 이벤트 Consumer(BacktestEventListener). ACK 모드는 기본값 AUTO: 리스너(→ @Transactional 서비스)가
    # 정상 반환하면, 즉 커밋 뒤에 ACK된다.
    listener:
      simple:
        # FINISHED 한 건이 크다(6개월 시계열 픽스처 56KB, 5년이면 수백 KB). 여러 건을 미리 받아 힙에 쌓지 않는다.
        # prefetch 1 + concurrency 1(기본값)은 한 인스턴스 안에서만 같은 Job의 이벤트 처리를 직렬로 만든다.
        # 백엔드를 다중 인스턴스로 띄우기 전에 서비스에 낙관적 락 또는 상태 조건부 UPDATE를 넣어야 한다.
        prefetch: 1
        # 기본값(true)이면 예외가 난 메시지가 즉시 다시 들어와 무한 루프가 된다. 재시도는 아래 retry가
        # 같은 delivery 안에서 in-process로 하고, 소진되면 reject → DLX → backtest.events.dlq로 간다.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

  # Job 전달에는 사용하지 않는다. 브로커는 RabbitMQ(spring.rabbitmq). Kafka는 설치만 해둔 상태이며
  # 전환·병행은 실측 후 결정한다 (루트 CLAUDE.md). 브로커 없이도 지연 연결이라 기동에 영향 없음.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  kafka:  # 미사용 (위 주석 참조). 큐 이름은 BacktestRabbitConfig 상수.
    backtest-job-topic: ${BACKTEST_JOB_TOPIC:backtest.jobs}

# 자동 탐색(spec 007) 실행 한도. ParamSearchProperties가 읽고 네 값 모두 필수다(@NotNull).
# 값이 없으면 기동이 실패한다 — 코드가 미확정 수치를 임의로 정하지 않기 때문이다.

thorp:
  learning:
    # 배우기 관리 계정 허용 목록(spec 013 research R5). 쉼표로 구분한 사용자 ID(users.id)다.
    # 비어 있으면 관리자가 없다 — 관리 경로가 모두 404 다. 014 가 역할을 주면 ConfiguredLearningAdminPolicy
    # 한 클래스만 바꾼다. 운영(application-prod.yml)은 기본값 없이 THORP_LEARNING_ADMIN_USER_IDS 를 읽는다.
    admin-user-ids: ${THORP_LEARNING_ADMIN_USER_IDS:}
  ops:
    # 운영자 경로(/internal/**)의 임시 문(spec 004 T012). 요청 헤더 X-Ops-Token 이 이 값과 같아야 열린다.
    # 비어 있으면 그 경로는 404 다 — 로그인(spec 014)이 붙기 전까지의 통로이고, 운영은 THORP_OPS_TOKEN 으로 넣는다.
    token: ${THORP_OPS_TOKEN:}
  backtest:
    # 결과 versions.engine 에 그대로 나가고 동일 버전 키에도 들어간다(R-03).
    # 워커를 올릴 때 이 값을 같이 올린다 — 값이 바뀌면 같은 조건이라도 새 실행이 된다.
    #
    # 2.1.0(T029): 평가 시작일 산식을 바꿨다. 키에 들어가는 start·end·warmupTradingDays 는
    # 그대로인데 effectiveStart 와 모든 지표가 움직인다. 올리지 않으면 옛 규칙(워밍업이 요청
    # 구간을 깎던 창)으로 계산된 결과가 REUSED 로 돌아가, 사용자에게는 새 구간이라고 표시되고
    # 숫자는 옛 구간의 것이 된다. 계산 규칙이 바뀌면 이 값을 올린다.
    #
    # 2.2.0(S15P21E205-205): 같은 이유로 한 번 더 올린다. 2.1.0 은 요청 시작일이 commonStart
    # 보다 뒤일 때만 깎지 않았고, 그 이하면 여전히 백엔드가 commonStart 로 밀었다. 이제 백엔드는
    # 아예 밀지 않고 미는 일은 워커가 단독으로 한다 — 요청 시작일이 이른 실행은 평가 구간이
    # 길어지고 모든 지표가 움직인다. 키에 들어가는 날짜는 사용자가 요청한 값이라 그대로이므로,
    # 이 값을 올리지 않으면 옛 규칙으로 계산된 결과가 REUSED 로 돌아간다.
    #
    # 2.3.0(S15P21E205-359): 계산 규칙은 그대로이고 결과에 개별 체결(fills)이 실린다. 숫자가 같은데도
    # 올리는 이유는 재사용이다 — 올리지 않으면 같은 조건의 새 요청이 체결 기록이 없는 옛 실행으로
    # REUSED 되어, spec 011 이 "다시 계산"을 요청해도 체결 없는 결과만 돌아온다.
    #
    # uv.lock(spec 004 T028): 워커 실행환경 지문이다. worker/uv.lock(LF)의 sha256 앞 12자이고,
    # 워커 이미지는 이 lock 만 보고 설치한다(T027). numpy·scipy 가 바뀌면 같은 조건이라도 숫자가
    # 달라질 수 있으므로 lock 이 바뀌면 이 값도 바뀌어 새 실행이 된다. 어긋나면
    # 백엔드 EngineVersionFingerprintTest 와 worker/tests/test_dependency_pins.py 가 올바른 값을
    # 알려 주며 실패한다(CI 는 바뀐 파트만 검사하므로 양쪽에 둔다).
    engine-version: "nautilus_trader 1.219.0 / worker 2.3.0 / uv.lock 8e8a6be0a6a8"
    # 비용 조건 기본 버전. 요청이 costProfileVersion 을 비우면 이 값을 쓴다.
    #
    # KR-ETF-2026-09 는 PD-07 확정값이다(spec 004 T021 마이그레이션). 바꿀 때는 행을 고치지 말고 새 버전
    # 행을 넣은 뒤 이 값만 바꾼다 — 옛 버전을 가리키는 실행은 옛 값으로 계속 해석된다. 화면은
    # GET /backtests/registry 에서 받은 버전을 요청에 명시해 보내므로, 이 값이 바뀌어도 이미 본
    # 조건과 적용 조건이 갈리지 않는다.
    default-cost-profile: KR-ETF-2026-09
    limits:
      # 실행 한도(FR-006, R-19). **값은 PD-06 이 실측 뒤 정한다 — 아래 수는 임시값이다.**
      # T014 는 장치만 만들었고, T012 집계 뷰(단건 대기시간 p95/p99, 사용자별 동시 탐색 수)가
      # 쌓이면 그 자료로 확정한다. 확정 전까지 provisional: true 라 429 응답에 임시임이 실린다.
      #
      # 여섯 값이 모두 @NotNull 이다 — 하나라도 비면 기동에 실패한다. 설정 누락으로 "무제한 실행
      # 금지"를 우회할 수 없게 하려는 것이다.
      #
      # 두 값 모두 **단건(SINGLE) 큐만** 센다(R-20). 탐색·경제환경 파생 실행은 backtest.jobs.bulk 로
      # 가고 이 한도의 대상이 아니다 — 그쪽 적재량은 thorp.param-search.dispatch-window 와 벌크를 집는
      # 워커 수(WORKER_FLEX_REPLICAS)가 정한다. 한 큐였을 때는 탐색을 세면 묶음이 영구 정지하고 안 세면
      # 단건만 429 를 받았다. 지금 429 는 단건끼리의 경쟁만 뜻한다.
      max-queued-per-user: 5
      # 단건 큐 전체. 사용자 사이의 공정성이 아니라 단건 워커 보호다.
      max-queued-total: 50
      # 로그인하지 않은 요청이 만든 단건 대기 실행의 합계(spec 005 B01). 비로그인은 사람을 가릴 수 없어 사용자별 한도
      # 대신 비로그인 요청 전부가 이 몫을 나눠 쓴다. **전체 한도보다 작게 둔다** — 같거나 크면 비로그인 클라이언트
      # 하나가 전체 대기열을 채워 로그인 사용자까지 429 를 받는다.
      max-queued-anonymous: 10
      # 실행 하나의 시간 상한(초). 넘으면 CANCEL 을 보내 완료 범위와 함께 멈춘다.
      max-run-seconds: 1800
      # 마지막 이벤트로부터 이만큼 조용하면 정체로 본다(초). 정상 PROGRESS 는 20거래일마다 오므로
      # 배치 하나 계산 시간의 몇 배로 잡는다. 짧으면 느린 계산을 정체로 오인한다.
      stale-run-seconds: 300
      # CANCEL 을 보낸 뒤 FINISHED 를 기다리는 시간(초). 넘으면 실행 주체가 없다고 보고 강제 종결한다.
      cancel-grace-seconds: 120
      # 위 값들이 실측으로 확정되지 않았다. PD-06 이 정해지면 false 로 바꾼다.
      provisional: true
    liveness:
      # 정체·실행 시간 초과·취소 무응답을 훑는 주기.
      interval: PT30S
      batch-size: 50
    republish:
      # 커밋됐는데 발행 확인이 없는 대기 작업을 다시 보내는 주기(R-18).
      interval: PT30S
      # 접수 직후 정상 발행과 경쟁하지 않도록 두는 유예. 이보다 오래 QUEUED·미발행이면 재발행한다.
      grace: PT1M
      batch-size: 50
  param-search:
    # 자동 탐색(spec 007) 기능 플래그. 꺼져 있으면 ParamSearchConfig가 로드되지 않는다.
    # 네 한도가 모두 채워졌으므로 이제 켜도 기동은 실패하지 않는다. 그래도 공통 기본값을
    # false로 두는 이유는 007이 아직 엔드포인트를 노출하지 않기 때문이다(M1 단계) —
    # HTTP API가 붙는 M3에서 켰다(2026-09-11). 접수·상태 조회 엔드포인트가 생겼으므로 더 이상
    # "노출하지 않는 모듈"이 아니다.
    # 한도 셋(max-candidates·dispatch-window·consecutive-failure-limit)이 @NotNull이므로 이 플래그를
    # 켠 채 그 값을 비우면 애플리케이션 전체가 기동에 실패한다 — 값을 지울 때는 플래그도 함께 끈다.
    # time-limit-seconds 만은 비울 수 있고, 비우면 묶음 실행시간 상한을 두지 않는다.
    # 스키마(V3)는 플래그와 무관하게 Flyway가 적용하므로 나중에 켜도 마이그레이션을 다시 할 일이 없다.
    enabled: true
    # 종목 금액을 요청이 생략했을 때 쓰는 값. 004 단일 실행 예시(docs/specs/backtest-api/examples)와
    # 같은 금액이다 — 두 경로의 결과를 나란히 볼 때 금액이 달라 수익률이 갈리는 일이 없어야 한다.
    # 화면이 금액을 받기 시작하면 요청 값이 이 값을 대신한다.
    default-initial-cash: "10000000.00"
    # 유효 후보 수 상한. 등록된 설정 조합을 최대 100개까지 한 묶음으로 실행한다.
    # 아직 실측으로 확정한 값은 아니므로 API의 limits.provisional 에 계속 표시한다.
    # **실행시간 상한을 두지 않으므로 묶음 크기를 막는 것은 지금 이 값 하나다.**
    max-candidates: 100
    # 현재 서버의 자동 탐색 벌크 워커 1개와 같은 크기다. prefetch 1이라 후보 1개가 실제 실행된다.
    dispatch-window: 1
    # 연속 실패 한도. **발행 창보다 커야 한다** — 창에 든 4건이 한꺼번에 실패하는 일(자료 결측 등)만으로
    # 묶음이 멈추면 산발적 실패에 과민 반응한다. 4를 넘는 5로 두어 한 창이 전멸해도 한 번 더 시도하고,
    # 그래도 실패하면 수백 건을 헛돌리기 전에 멈춘다.
    consecutive-failure-limit: 5
    # 묶음 실행시간 상한. **값을 비워 두어 상한을 두지 않는다**(2026-09-23, S15P21E205-417).
    # 시간으로 끊으면 후보를 순서대로 도는 구성에서 뒤쪽 후보가 늘 PARTIAL 로 잘려 나가고, 같은 묶음을
    # 다시 돌려도 어디까지 나올지가 그때그때 달라진다 — 사용자가 고른 조합은 다 돌려 주고 비교는
    # 완주한 결과로만 한다. 묶음 크기는 max-candidates 가, 망가진 묶음은 consecutive-failure-limit 가 막는다.
    # 값을 되살리려면 초 단위 정수를 적으면 된다(예: 1800). 0 이하는 설정 실수로 보고 기동을 막는다.
    time-limit-seconds:
  result:
    # 결과 공개 열람(spec 005 T004). **네 값 모두 임시값이다** — 유효 시간은 PD-23, 거래 내역 페이지 크기는
    # R-11 이 정한다. 확정 전까지 수치는 이 파일에만 두고 spec 문서에 적지 않는다.
    # 여섯 값이 모두 @NotNull 이라 하나라도 비면 기동에 실패한다(ResultProperties).
    #
    # 비로그인 요청의 공개 토큰 유효 시간. 기준은 요청 생성 시각이다(R-03). 로그인 요청은 만료가 없다.
    public-token-ttl: P7D
    # 만료된 비로그인 요청을 훑는 주기와 한 번에 지우는 수(B02 정리 작업).
    expiry-sweep-interval: PT10M
    expiry-sweep-batch-size: 100
    # 만료로 지운 토큰의 묘비를 남겨 두는 기간(T087). 만료 시각부터 센다. 이 기간 안에는 지운 주소도 410 안내를 받는다.
    tombstone-retention: P30D
    # 공개 경로 /results/{token}/trades 의 페이지 크기이자 상한. 004 거래 내역 기본값과 같게 둔다.
    trades-page-size: 100
    # 진행 시계열 구독(SSE) 하나를 열어 두는 상한. 배포 환경 nginx 의 /api/ proxy_read_timeout(300s)보다
    # 짧게 둔다 — 길면 프록시가 먼저 끊고 화면은 서버 장애와 구분할 수 없는 오류를 받는다.
    progress-stream-timeout: PT4M
  assistant:
    # 화면 맥락 도우미(spec 015, ADR-0008). **비활성이 기본**이다 — 켜는 것은 품질 관문(T053) 뒤이고, 켤 때
    # THORP_ASSISTANT_ENABLED_SCOPES=RESULT 를 넣는다. 키·주소·모델 중 하나라도 비면 어댑터 빈이 뜨지 않아
    # capabilities.enabled=false 이고 기동은 정상이다(계약 §4). 그래서 이 넷은 prod 에서도 빈 기본값이다.
    enabled-scopes: ${THORP_ASSISTANT_ENABLED_SCOPES:}
    model:
      api-key: ${THORP_ASSISTANT_API_KEY:}
      base-url: ${THORP_ASSISTANT_BASE_URL:}
      model: ${THORP_ASSISTANT_MODEL:}
    # 남용 방지 한도(FR-013). 금액 상한은 두지 않는다. 초안 수치이며 실측 뒤 조정한다(원칙 IX).
    # 인스턴스 메모리 카운터라 다중 인스턴스에서는 인스턴스 수만큼 늘어난다 — 보안 경계가 아니다.
    limits:
      per-ip-per-minute: 8
      per-token-per-minute: 5
      per-day: 1000
      question-max-length: 300
      max-rounds: 2
      max-facts: 60
      max-facts-per-round: 30
    # 요청 전체 시간 예산이 우선이고, 라운드별 모델 호출 예산은 그 안에서 남은 시간과 작은 쪽이다.
    timeout:
      total: PT15S
      first-call: PT7S
      next-call: PT4S
    # 답변 검증 상한(계약 §2.4).
    answer:
      max-length: 600
      max-parts: 5
  my-records:
    # 한 사용자가 저장해 둘 수 있는 탐색 묶음 기록 수(spec 006 FR-018, PD-13).
    #
    # **값이 아니라 장치가 이 Task 의 산출물이다.** 20 은 spec 이 "초기 임시값"으로 표시한 수이고
    # PD-13 이 실측 뒤 정한다 — spec 은 확정값을 고정하지 않는다. 004 PD-06 한도와 같은 방식이다.
    #
    # 상한은 탐색 묶음에만 있다. 단일 분석·경제환경 기록에는 개수 상한이 없다(FR-018).
    # @NotNull 이라 비면 기동에 실패한다 — 설정 누락으로 "상한 없이 저장"이 되지 않게 한다.
    search-bundle-limit: 20
  regimelink:
    # 사례 연결(spec 011 T080). 세 값 모두 @NotNull 이라 비면 기동에 실패한다 — 설정 누락으로
    # "감시가 돌지 않음"이나 "상한 없이 발행"이 조용히 성립하지 않게 한다.
    #
    # **값이 아니라 장치가 이 Task 의 산출물이다.** 아래 수는 계약이 정한 구조에서 나온 임시값이고
    # 실측 뒤 조정한다 — spec 은 확정값을 고정하지 않는다.
    #
    # PENDING_RUN 링크(현금 시작·전체 기간 재계산)의 입력 실행을 다시 보는 간격. 브로커에 닿지 못해
    # 발행 기록이 비어 있는 QUEUED 링크도 같은 주기로 다시 집는다.
    pending-run-sweep-interval: PT30S
    # 작업 메시지 inputs.portfolioSeries 의 날짜 행 수 상한. 사후 63거래일 + 기준일 한 행이 구조상 최대다.
    job-max-rows: 65
    # 보유 스냅샷 한 건의 종목 수 상한. 대응표 섹터 수를 넘을 수 없다(계약 "크기 상한").
    job-max-instruments: 8

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: THORP_SESSION
        http-only: true
        same-site: lax
        path: /
  # 결과 시계열이 이 앱에서 가장 큰 응답이다 — 5년 일봉이면 거래일 약 1,250개 × 5필드로 수백 KB고
  # 날짜·숫자 문자열이 반복돼 압축률이 높다. 나머지 응답은 min-response-size 아래라 영향이 없다.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      group:
        # 뉴스 신선도를 따로 볼 수 있는 자리. /actuator/health/news 로 열린다.
        # 전체 health 를 show-details 로 열지 않는 이유는 DB·브로커 연결 정보까지 함께 나가기 때문이다.
        # 뉴스 지표는 마지막 성공 시각과 지연 여부만 담아 그대로 보여도 문제가 없다 (spec FR-024).
        news:
          include: newsFreshness
          show-details: always
