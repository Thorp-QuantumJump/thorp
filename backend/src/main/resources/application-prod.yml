spring:
  config:
    activate:
      on-profile: prod

  # 배포 환경의 연결 정보는 infra/.env.prod에서 Compose를 통해 주입한다. 기본값을 두지 않는다.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # 스키마 변경은 Flyway만 수행하고, Hibernate는 Entity와 실제 스키마가 일치하는지 검증만 한다.
  jpa:
    hibernate:
      ddl-auto: validate

  # baseline-on-migrate는 켜지 않는다. 기존 DB 상태를 확인하지 않은 자동 baseline은
  # 이미 존재하는 스키마 위에 V1을 건너뛴 것으로 기록해버린다.
  # 기존 EC2 DB 전환 절차는 docs/guides/prod-db-flyway-migration.md 참고.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # 스키마를 통째로 지우는 clean을 막는다. Flyway 9부터 기본값이 true지만 명시해 둔다 —
    # 기본값에 기대면 버전을 올릴 때 조용히 바뀌어도 알아채지 못한다.
    # constitution "스키마 변경 규칙": 운영 데이터베이스를 초기화하는 명령은 쓰지 않는다.
    clean-disabled: true

  # 운영 스키마는 위 Flyway 마이그레이션만 관리한다.
  session:
    jdbc:
      initialize-schema: never

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

server:
  # nginx가 TLS를 끝내고 평문 HTTP로 넘긴다. 이 값이 없으면 request.isSecure()가 false라
  # 코드에서 만드는 XSRF-TOKEN 쿠키에 Secure가 붙지 않는다 — 세션 쿠키는 아래에서 직접 지정하지만
  # CSRF 쿠키는 요청이 HTTPS인지 보고 정하기 때문이다(SecurityConfig.csrfTokenRepository).
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

# 실행 한도(FR-006, R-19). **기본값을 두지 않는다** — 값이 없으면 기동이 실패한다.
#
# spec FR-006 은 "상한을 정하기 전에 무제한 실행을 허용하지 않는다"이다. 공통 설정에는 임시값이
# 들어 있지만 운영에서는 그것을 물려받지 않는다 — 누가 PD-06 을 정하고 배포 환경에 넣어야
# 비로소 뜬다. 다른 연결 정보와 같은 방식이다(infra/.env.prod).
#
# provisional 도 환경에서 받는다. PD-06 이 확정돼 아래 여섯 값이 실측 근거를 갖게 되면
# false 로 넣는다 — 그때까지는 true 로 두어 429 응답에 임시값임이 실린다.
thorp:
  # 배우기 관리 계정 허용 목록(spec 013). 실행 한도와 같이 기본값을 두지 않는다 — 누가 글을 게시하는지는 운영자가
  # 명시한다. 명시한 빈 값은 "관리자 없음"이다.
  learning:
    admin-user-ids: ${THORP_LEARNING_ADMIN_USER_IDS}
  backtest:
    limits:
      max-queued-per-user: ${THORP_LIMIT_MAX_QUEUED_PER_USER}
      max-queued-total: ${THORP_LIMIT_MAX_QUEUED_TOTAL}
      max-queued-anonymous: ${THORP_LIMIT_MAX_QUEUED_ANONYMOUS}
      max-run-seconds: ${THORP_LIMIT_MAX_RUN_SECONDS}
      stale-run-seconds: ${THORP_LIMIT_STALE_RUN_SECONDS}
      cancel-grace-seconds: ${THORP_LIMIT_CANCEL_GRACE_SECONDS}
      provisional: ${THORP_LIMIT_PROVISIONAL}
  # 결과 공개 열람(spec 005 T004). 실행 한도와 같이 **기본값을 두지 않는다** — 유효 시간(PD-23)과 거래 내역 상한(R-11)을
  # 누가 정해 배포 환경에 넣어야 비로소 뜬다. 공통 설정의 임시값을 운영이 조용히 물려받지 않게 한다.
  result:
    public-token-ttl: ${THORP_RESULT_PUBLIC_TOKEN_TTL}
    expiry-sweep-interval: ${THORP_RESULT_EXPIRY_SWEEP_INTERVAL}
    expiry-sweep-batch-size: ${THORP_RESULT_EXPIRY_SWEEP_BATCH_SIZE}
    tombstone-retention: ${THORP_RESULT_TOMBSTONE_RETENTION}
    trades-page-size: ${THORP_RESULT_TRADES_PAGE_SIZE}
    progress-stream-timeout: ${THORP_RESULT_PROGRESS_STREAM_TIMEOUT}
  # 사례 연결(spec 011 T080). 실행 한도·결과 공개와 같이 **기본값을 두지 않는다** — 감시 주기와 작업
  # 상한을 누가 정해 배포 환경에 넣어야 비로소 뜬다. 공통 설정의 임시값을 운영이 물려받지 않게 한다.
  regimelink:
    pending-run-sweep-interval: ${THORP_REGIMELINK_PENDING_RUN_SWEEP_INTERVAL}
    job-max-rows: ${THORP_REGIMELINK_JOB_MAX_ROWS}
    job-max-instruments: ${THORP_REGIMELINK_JOB_MAX_INSTRUMENTS}
